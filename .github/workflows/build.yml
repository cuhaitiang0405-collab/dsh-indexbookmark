name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # package.json 的 allowScripts 已声明 esbuild，npm install 会放行其安装脚本
      - run: npm install
      - run: node build.mjs
      - run: node -e "require('fs').accessSync('lib/client.js'); console.log('bundle OK')"
